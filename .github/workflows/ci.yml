name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-static:
    name: API lint, types, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Native libraries for PDF rendering (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Unit tests
        run: pytest tests/unit
      - name: OpenAPI contract is committed (web types are generated from it)
        run: |
          python scripts/export_openapi.py /tmp/openapi.json
          diff -u ../web/src/app/core/api/openapi.json /tmp/openapi.json

  web-static:
    name: Web lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match the committed OpenAPI schema
        run: |
          npx --yes -p openapi-typescript@7 -p typescript@5 openapi-typescript src/app/core/api/openapi.json -o /tmp/schema.d.ts
          diff -u src/app/core/api/schema.d.ts /tmp/schema.d.ts
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm test
      - run: npx ng build

  integration:
    name: Migrations, pgTAP, API integration, E2E
    runs-on: ubuntu-latest
    needs: [api-static, web-static]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start Supabase (applies every migration and the seed from scratch = migration check)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,supavisor,postgres-meta

      - name: pgTAP (RLS, tenant isolation, permissions, audit)
        run: supabase test db

      - name: API integration tests
        working-directory: apps/api
        env:
          REQUIRE_DB: "1"
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          cp .env.example .env
          key=$(supabase status -o env | grep '^SECRET_KEY=' | cut -d= -f2- | tr -d '"')
          sed -i "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=$key|" .env
          .venv/bin/pytest tests/integration

      - name: E2E (Playwright)
        working-directory: apps/web
        env:
          CI: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
